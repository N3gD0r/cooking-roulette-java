spring:
  application:
    name: cooking

  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.n3gd0r: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
