server:
  port: 4444
spring:
  application:
    name: cooking-tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
  datasource:
    url: ${DB_TEST_URL}
    username: ${DB_TEST_USER}
    password: ${DB_TEST_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
  flyway:
    enabled: true
