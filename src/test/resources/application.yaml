spring:
  application:
    name: cooking-tests
  mvc:
    apiversion:
      default: 1.0
      detect-supported: true
      use:
        path-segment: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
  flyway:
    enabled: true
server:
  port: 4444
